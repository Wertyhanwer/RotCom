services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: ${DB_NAME:-rotcom}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # api при старте накатывает миграции, поэтому ждёт, пока Postgres начнёт принимать подключения
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    build: ./test_db
    ports:
      - "${DB_TEST_EXTERNAL_PORT}:5432"
    profiles:
      - test

  mongo_test:
    image: mongo:8
    ports:
      - "${MONGO_TEST_EXTERNAL_PORT:-27019}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rotcom
      MONGO_INITDB_ROOT_PASSWORD: "12345"
    profiles:
      - test

  mongo:
    image: mongo:8
    ports:
      - "${MONGO_EXTERNAL_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is not set in .env}
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    ports:
      - "${API_EXTERNAL_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    env_file:
      - .env

  frontend:
    depends_on:
    - api
    build: ./frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:80"
    env_file:
      - .env

volumes:
  db_data:
  mongo_data:
