services:
  db:
    build: ./db
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  db_test:
    build: ./test_db
    ports:
      - "${DB_TEST_EXTERNAL_PORT}:5432"
    profiles:
      - test

  mongo:
    image: mongo:8
    ports:
      - "${MONGO_EXTERNAL_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    ports:
      - "${API_EXTERNAL_PORT}:8000"
    depends_on:
      - db
      - mongo
    env_file:
      - .env

  frontend:
    depends_on:
    - api
    build: ./frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:80"
    env_file:
      - .env

volumes:
  db_data:
  mongo_data:
