<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RotCom</title>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/chat.css" />
  </head>
  <body>
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <span class="logo">RotCom</span>
          <div class="search-wrap">
            <input class="input" type="text" id="search-input" placeholder="Поиск по логину" />
            <button class="btn-primary" id="search-btn">Найти</button>
          </div>
        </div>
        <div class="chat-list" id="chat-list"></div>
      </div>
      <div class="main">
        <div class="main-header">
          <p class="no-chat">Выберите чат</p>
        </div>
        <div class="messages"></div>
        <div class="message-input">
          <input class="input" type="text" id="msg-input" placeholder="Сообщение..." />
          <button class="btn-send" id="msg-send">➤</button>
        </div>
      </div>
    </div>
    <script src="js/chat/state.js"></script>
    <script src="js/chat/api.js"></script>
    <script src="js/chat/ui.js"></script>
    <script src="js/chat/ws.js"></script>
    <script src="js/chat/chat.js"></script>
  </body>
</html>
