<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RotCom</title>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>RotCom</h1>
        <div class="tabs">
          <button class="tab active">Войти</button>
          <button class="tab">Регистрация</button>
        </div>
        <form class="form active" id="form-login">
          <input class="input" id="login-input" type="email" placeholder="Email" />
          <input class="input" id="login-password" type="password" placeholder="Пароль" />
          <button class="btn-primary" type="submit">Войти</button>
        </form>
        <form class="form" id="form-register">
          <input class="input" type="email" id="reg-email" placeholder="Email" />
          <input class="input" type="text" id="reg-username" placeholder="Имя пользователя" />
          <input class="input" type="text" id="reg-login" placeholder="Логин" />
          <input class="input" type="password" id="reg-password" placeholder="Пароль" />
          <input class="input" type="password" id="reg-password2" placeholder="Повторите пароль" />
          <button class="btn-primary" type="submit">Зарегистрироваться</button>
        </form>
      </div>
    </div>
    <script src="js/auth.js"></script>
  </body>
</html>
