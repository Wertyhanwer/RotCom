<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RotCom</title>  
    <script src="config.js"></script>
  <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="auth-wrap">

      <div class="auth-card">

        <h1>RotCom</h1>
          <div class="tabs">
          <button class="tab active">Войти</button>
          <button class="tab">Регистрация</button>
        </div>

        <form class="form active" id="form-login">
          <input class="input" id="login-input" type="email" placeholder="Email" />
          <input class="input" id="login-password" type="password" placeholder="Пароль" />
          <button class="btn-primary" type="submit">Войти</button>
        </form>

        <form class="form" id="form-register">
          <input class="input" type="email" id="reg-email" placeholder="Email" />
          <input class="input" type="text" id="reg-username" placeholder="Имя пользователя" />
          <input class="input" type="text" id="reg-login" placeholder="Логин" />
          <input class="input" type="password" id="reg-password" placeholder="Пароль" />
          <input class="input" type="password" id="reg-password2" placeholder="Повторите пароль" />
          <button class="btn-primary" type="submit">Зарегистрироваться</button>
        </form>

      </div>

      
    </div>

    <script>
      const tabs = document.querySelectorAll('.tab')
      const formLogin = document.getElementById('form-login')
      const formRegister = document.getElementById('form-register')

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'))
          tab.classList.add('active')

          if (tab.textContent === 'Войти') {
            formLogin.classList.add('active')
            formRegister.classList.remove('active')
          } else {
            formRegister.classList.add('active')
            formLogin.classList.remove('active')
          }
        })
      })

      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault()

        const login = document.getElementById('login-input').value
        const password = document.getElementById('login-password').value

        const response = await fetch(
          `${API}/login/?login=${encodeURIComponent(login)}&password=${encodeURIComponent(password)}`,
          { method: 'POST' }
        )

        const data = await response.json()
        
        if (response.ok) {
          localStorage.setItem('token', data.access_token)
          window.location.href = 'chat.html'
        } else {
          console.log('Ошибка:', data.detail)
        }
      })

      document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault()

        const email = document.getElementById('reg-email').value
        const username = document.getElementById('reg-username').value
        const login = document.getElementById('reg-login').value
        const password1 = document.getElementById('reg-password').value
        const password2 = document.getElementById('reg-password2').value

        if (password1 !== password2) {
          alert('Пароли не совпадают!')
          console.log('Пароли не совпадают')
          return
        }

        const body = {
          username: username,
          login: login,
          email: email,
          password: password1
        }

        const response = await fetch(`${API}/registration/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })

        const data = await response.json()
        if (response.ok) {
          tabs[0].click()
        } else {
          console.log('Ошибка:', data.detail)
        }
      })
    </script>

  </body>
</html>
